<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMIO AGENCY</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        tiktok: {
                            pink: '#FE2C55',
                            cyan: '#25F4EE',
                            dark: '#121212',
                            card: '#1E1E1E',
                            border: '#2F2F2F'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #121212; color: #f3f4f6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

</head>
<body class="min-h-screen bg-[#121212] flex flex-col selection:bg-tiktok-pink selection:text-white">

    <!-- Toast Notification Modal (Custom Alert) -->
    <div id="toast" class="fixed top-5 right-5 z-50 transform translate-y-[-200%] transition-transform duration-300 bg-[#1E1E1E] border border-[#2F2F2F] text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3">
        <i id="toast-icon" class="fa-solid fa-circle-check text-tiktok-cyan text-lg"></i>
        <div>
            <h4 id="toast-title" class="font-bold text-sm">Notifikasi</h4>
            <p id="toast-msg" class="text-xs text-gray-400"></p>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirm-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-[#1E1E1E] border border-[#2F2F2F] w-full max-w-md rounded-2xl p-6 shadow-2xl">
            <h3 id="confirm-title" class="text-lg font-bold text-white mb-2">Konfirmasi Aksi</h3>
            <p id="confirm-text" class="text-sm text-gray-300 mb-6">Apakah Anda yakin ingin melanjutkan?</p>
            <div class="flex space-x-3">
                <button id="confirm-cancel" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white py-2.5 rounded-xl font-medium text-sm transition">Batal</button>
                <button id="confirm-ok" class="flex-1 bg-tiktok-pink hover:bg-opacity-90 text-white py-2.5 rounded-xl font-medium text-sm transition">Ya, Lanjutkan</button>
            </div>
        </div>
    </div>

    <!-- QRIS Modal -->
    <div id="qris-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-[#1E1E1E] border border-[#2F2F2F] w-full max-w-sm rounded-2xl p-6 shadow-2xl text-center relative">
            <button onclick="closeQrisModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="text-lg font-bold text-white mb-1">Scan QRIS Deposit</h3>
            <p class="text-xs text-gray-400 mb-4">Scan QRIS di bawah ini untuk melakukan pembayaran</p>
            <div class="bg-white p-4 rounded-xl inline-block mb-4">
                <img id="qris-image-display" src="https://placehold.co/250x250/121212/FFFFFF?text=QRIS+Admin" alt="QRIS" class="w-48 h-48 object-cover rounded-lg mx-auto">
            </div>
            <p id="qris-amount-display" class="text-sm font-semibold text-tiktok-cyan mb-4">Nominal: Rp 0</p>
            <button onclick="confirmDepositSubmit()" class="w-full bg-tiktok-pink hover:bg-opacity-90 text-white py-3 rounded-xl font-bold text-sm transition shadow-lg shadow-tiktok-pink/30">Saya Sudah Membayar</button>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="flex-1 flex flex-col max-w-md mx-auto w-full bg-[#121212] relative shadow-2xl border-x border-[#2F2F2F]">

        <!-- HEADER -->
        <header class="sticky top-0 z-40 bg-[#121212]/90 backdrop-blur-md border-b border-[#2F2F2F] px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-tiktok-pink to-tiktok-cyan flex items-center justify-center text-white font-black text-lg shadow-md shadow-tiktok-pink/20">L</div>
                <span class="font-black text-lg tracking-wider bg-gradient-to-r from-white via-gray-200 to-tiktok-cyan bg-clip-text text-transparent">LUMIO<span class="text-tiktok-pink"> AGENCY</span></span>
            </div>
            <div id="header-right-actions" class="flex items-center space-x-3">
                <!-- Dynamic Auth / User Quick info -->
            </div>
        </header>

        <!-- DYNAMIC CONTENT AREA -->
        <main id="main-content" class="flex-1 pb-20">
            <!-- Content injected via JS -->
        </main>

        <!-- BOTTOM NAVIGATION (Member View) -->
        <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#1E1E1E]/95 backdrop-blur-md border-t border-[#2F2F2F] px-3 py-2.5 flex justify-between items-center z-40 hidden">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-tiktok-pink transition">
                <i class="fa-solid fa-house text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium">Beranda</span>
            </button>
            <button onclick="switchTab('drhopsip')" id="nav-drhopsip" class="flex flex-col items-center text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-box-open text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium">Drhopsip</span>
            </button>
            <button onclick="switchTab('clockin')" id="nav-clockin" class="flex flex-col items-center text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-camera text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium">Clock In</span>
            </button>
            <button onclick="switchTab('history')" id="nav-history" class="flex flex-col items-center text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-clock-rotate-left text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium">History</span>
            </button>
            <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-user text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium">Profil</span>
            </button>
        </nav>

    </div>

    <!-- FIREBASE & APP SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCPN-lA9BFKJDbvqYGmt5yZaLmI2yVuiwo",
            authDomain: "affilate-2a851.firebaseapp.com",
            projectId: "affilate-2a851",
            storageBucket: "affilate-2a851.firebasestorage.app",
            messagingSenderId: "589263119440",
            appId: "1:589263119440:web:1b3d498f0434dee52fdd55",
            measurementId: "G-9FVJ6TSS8K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'affiliate-id-default';

        // State Management
        window.currentUser = null;
        window.isAdmin = false;
        window.activeTab = 'home';
        window.membersData = [];
        window.catalogData = [];
        window.attendanceData = [];
        window.transactionsData = [];
        window.adminSettings = { qrisUrl: 'https://placehold.co/300x300/121212/FFFFFF?text=QRIS+LUMIO+AGENCY' };
        let currentDepositNominal = 0;

        // Initialize Firebase Authentication
        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.error("Auth error:", e);
                await signInAnonymously(auth).catch(err => console.error("Anon auth failed:", err));
            }
        }

        // Realtime Listeners
        function setupListeners() {
            // Listen to Members
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'members'), (snapshot) => {
                window.membersData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                // If logged in, update current user session data
                if (window.currentUser && !window.isAdmin) {
                    const updated = window.membersData.find(m => m.id === window.currentUser.id);
                    if (updated) {
                        window.currentUser = updated;
                        if (['home', 'profile', 'drhopsip'].includes(window.activeTab)) {
                            renderApp();
                        }
                    }
                }
                if (window.isAdmin && window.activeTab === 'admin-members') {
                    renderAdminMembers();
                }
            }, (err) => console.error("Members listener error:", err));

            // Listen to Attendance (Clock In)
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'attendance'), (snapshot) => {
                window.attendanceData = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                if (!window.isAdmin && window.activeTab === 'clockin' && !camStream && !shotData) renderApp();
                if (window.isAdmin && (adminSubTab === 'attendance' || adminSubTab === 'dashboard')) renderAdminPanel();
            }, (err) => console.error("Attendance listener error:", err));

            // Listen to Transactions / History
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'transactions'), (snapshot) => {
                window.transactionsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                if (window.activeTab === 'history' || window.activeTab === 'home') {
                    renderApp();
                }
                if (window.isAdmin && (window.activeTab === 'admin-transactions' || window.activeTab === 'admin-dashboard')) {
                    renderAdminPanel();
                }
            }, (err) => console.error("Transactions listener error:", err));

            // Listen to Settings (QRIS)
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'admin_config'), (docSnap) => {
                if (docSnap.exists()) {
                    window.adminSettings = docSnap.data();
                }
            }, (err) => console.error("Settings listener error:", err));
        }

        // Global Utility Functions
        window.showToast = function(title, msg, isError = false) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-msg').innerText = msg;
            icon.className = isError ? "fa-solid fa-circle-exclamation text-tiktok-pink text-lg" : "fa-solid fa-circle-check text-tiktok-cyan text-lg";
            toast.classList.remove('translate-y-[-200%]');
            setTimeout(() => {
                toast.classList.add('translate-y-[-200%]');
            }, 3000);
        }

        window.formatRupiah = function(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        window.showConfirm = function(title, text, onYes) {
            const modal = document.getElementById('confirm-modal');
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-text').innerText = text;
            modal.classList.remove('hidden');
            
            const btnYes = document.getElementById('confirm-ok');
            const btnCancel = document.getElementById('confirm-cancel');

            const newYes = btnYes.cloneNode(true);
            const newCancel = btnCancel.cloneNode(true);
            btnYes.parentNode.replaceChild(newYes, btnYes);
            btnCancel.parentNode.replaceChild(newCancel, btnCancel);

            newYes.addEventListener('click', () => {
                modal.classList.add('hidden');
                onYes();
            });
            newCancel.addEventListener('click', () => {
                modal.classList.add('hidden');
            });
        }

        // Navigation Switcher
        window.switchTab = function(tab) {
            window.activeTab = tab;
            if (window.stopCam) window.stopCam();
            // Update bottom nav UI
            const nav = document.getElementById('bottom-nav');
            if (window.currentUser && !window.isAdmin) {
                nav.classList.remove('hidden');
                ['home', 'drhopsip', 'clockin', 'history', 'profile'].forEach(t => {
                    const btn = document.getElementById(`nav-${t}`);
                    if (btn) {
                        if (t === tab) {
                            btn.className = "flex flex-col items-center text-tiktok-pink transition";
                        } else {
                            btn.className = "flex flex-col items-center text-gray-400 hover:text-white transition";
                        }
                    }
                });
            } else {
                nav.classList.add('hidden');
            }
            renderApp();
        }

        // Render Controller
        window.renderApp = function() {
            const main = document.getElementById('main-content');
            const headerRight = document.getElementById('header-right-actions');
            const nav = document.getElementById('bottom-nav');

            if (window.isAdmin) {
                nav.classList.add('hidden');
                headerRight.innerHTML = `<button onclick="adminLogout()" class="bg-tiktok-pink/20 text-tiktok-pink px-3 py-1.5 rounded-xl font-semibold text-xs border border-tiktok-pink/40 hover:bg-tiktok-pink hover:text-white transition"><i class="fa-solid fa-right-from-bracket mr-1"></i> Logout Admin</button>`;
                renderAdminPanel();
                return;
            }

            if (!window.currentUser) {
                nav.classList.add('hidden');
                headerRight.innerHTML = `<button onclick="renderLogin()" class="text-xs font-semibold text-tiktok-cyan hover:underline">Masuk / Daftar</button>`;
                renderAuthPortal();
                return;
            }

            // Member Logged In
            nav.classList.remove('hidden');
            headerRight.innerHTML = `<div class="flex items-center space-x-2"><span class="text-xs text-gray-300 font-medium">@${window.currentUser.username}</span><button onclick="memberLogout()" class="text-gray-400 hover:text-tiktok-pink transition"><i class="fa-solid fa-power-off text-sm"></i></button></div>`;

            if (window.activeTab === 'home') renderHomeTab();
            else if (window.activeTab === 'drhopsip') renderDrhopsipTab();
            else if (window.activeTab === 'clockin') renderClockInTab();
            else if (window.activeTab === 'history') renderHistoryTab();
            else if (window.activeTab === 'profile') renderProfileTab();
        }

        // ================= AUTHENTICATION VIEWS =================
        window.renderAuthPortal = function() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="p-6 flex flex-col justify-center min-h-[80vh]">
                    <div class="text-center mb-8">
                        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-tiktok-pink to-tiktok-cyan flex items-center justify-center text-white font-black text-3xl mx-auto mb-4 shadow-xl shadow-tiktok-pink/20">L</div>
                        <h2 class="text-2xl font-black text-white">Selamat Datang di LUMIO AGENCY</h2>
                        <p class="text-xs text-gray-400 mt-1">Platform Dropship & Absensi Terpercaya</p>
                    </div>

                    <div class="flex bg-[#1E1E1E] p-1 rounded-2xl mb-6 border border-[#2F2F2F]">
                        <button onclick="toggleAuthMode('login')" id="tab-btn-login" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition bg-tiktok-pink text-white shadow-md">Masuk</button>
                        <button onclick="toggleAuthMode('register')" id="tab-btn-register" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition text-gray-400">Daftar</button>
                    </div>

                    <div id="auth-form-container">
                        <!-- Default Login Form -->
                        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-300 mb-1">Username TikTok / Admin</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-500"><i class="fa-solid fa-at text-xs"></i></span>
                                    <input type="text" id="login-username" required class="w-full bg-[#1E1E1E] border border-[#2F2F2F] rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-tiktok-cyan transition" placeholder="Masukkan username tiktok">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-300 mb-1">Password</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-500"><i class="fa-solid fa-lock text-xs"></i></span>
                                    <input type="password" id="login-password" required class="w-full bg-[#1E1E1E] border border-[#2F2F2F] rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-tiktok-cyan transition" placeholder="••••••••">
                                </div>
                            </div>
                            <button type="submit" class="w-full bg-gradient-to-r from-tiktok-pink to-pink-600 hover:opacity-90 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-tiktok-pink/20">Masuk Akun</button>
                        </form>
                    </div>
                </div>
            `;
        }

        window.toggleAuthMode = function(mode) {
            const btnLogin = document.getElementById('tab-btn-login');
            const btnRegister = document.getElementById('tab-btn-register');
            const container = document.getElementById('auth-form-container');

            if (mode === 'login') {
                btnLogin.className = "flex-1 py-2.5 rounded-xl text-xs font-bold transition bg-tiktok-pink text-white shadow-md";
                btnRegister.className = "flex-1 py-2.5 rounded-xl text-xs font-bold transition text-gray-400";
                container.innerHTML = `
                    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-300 mb-1">Username TikTok / Admin</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-500"><i class="fa-solid fa-at text-xs"></i></span>
                                <input type="text" id="login-username" required class="w-full bg-[#1E1E1E] border border-[#2F2F2F] rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-tiktok-cyan transition" placeholder="Masukkan username tiktok">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-300 mb-1">Password</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-gray-500"><i class="fa-solid fa-lock text-xs"></i></span>
                                <input type="password" id="login-password" required class="w-full bg-[#1E1E1E] border border-[#2F2F2F] rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-tiktok-cyan transition" placeholder="••••••••">
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-gradient-to-r from-tiktok-pink to-pink-600 hover:opacity-90 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-tiktok-pink/20">Masuk Akun</button>
                    </form>
                `;
            } else {
                btnRegister.className = "flex-1 py-2.5 rounded-xl text-xs font-bold transition bg-tiktok-pink text-white shadow-md";
                btnLogin.className = "flex-1 py-2.5 rounded-xl text-xs font-bold transition text-gray-400";
                container.innerHTML = `
                    <form id="register-form" onsubmit="handleRegister(event)" class="space-y-3 pb-8">
                        <div>
                            <label class="block text-xs font-semibold text-gray-300 mb-1">Nama Lengkap</label>
                            <input type="text" id="reg-nama" required class="w-full bg-[#1E1E1E] border border-[#2F2F2F] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-tiktok-cyan transition" placeholder="Nama lengkap Anda">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-300 mb-1">No WhatsApp</label>
                            <input type="text" id="reg-nowa" required class="w-full bg-[#1E1E1E] border border-[#2F2F2F] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-tiktok-cyan transition" placeholder="08xxxxxxxxxx">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-300 mb-1">Email</label>
                            <input type="email" id="reg-email" required class="w-full bg-[#1E1E1E] border border-[#2F2F2F] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-tiktok-cyan transition" placeholder="email@domain.com">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-300 mb-1">Username Tiktok</label>
                            <input type="text" id="reg-username" required class="w-full bg-[#1E1E1E] border border-[#2F2F2F] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-tiktok-cyan transition" placeholder="username_tiktok">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-300 mb-1">Password</label>
                            <input type="password" id="reg-password" required class="w-full bg-[#1E1E1E] border border-[#2F2F2F] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-tiktok-cyan transition" placeholder="••••••••">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-semibold text-gray-300 mb-1">Nama Bank</label>
                                <input type="text" id="reg-bank" required class="w-full bg-[#1E1E1E] border border-[#2F2F2F] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-tiktok-cyan transition" placeholder="BCA / Dana / dll">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-300 mb-1">No Rekening</label>
                                <input type="text" id="reg-norek" required class="w-full bg-[#1E1E1E] border border-[#2F2F2F] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-tiktok-cyan transition" placeholder="Nomor rekening">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-300 mb-1">Nama Pemilik Rekening</label>
                            <input type="text" id="reg-namapemilik" required class="w-full bg-[#1E1E1E] border border-[#2F2F2F] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-tiktok-cyan transition" placeholder="Sesuai buku rekening">
                        </div>
                        <button type="submit" class="w-full bg-gradient-to-r from-tiktok-pink to-pink-600 hover:opacity-90 text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg shadow-tiktok-pink/20 mt-4">Daftar Sekarang (Bonus 100k)</button>
                    </form>
                `;
            }
        }

        window.handleLogin = async function(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            // Check Admin Login
            if (username === 'admin' && password === '234817') {
                window.isAdmin = true;
                window.showToast("Berhasil", "Selamat datang Admin!");
                renderApp();
                return;
            }

            // Check Member Login

        // 2. DRHOPSIP TAB
        const memRef = id => doc(db, 'artifacts', appId, 'public', 'data', 'members', id);
        const colRef = n => collection(db, 'artifacts', appId, 'public', 'data', n);
        const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
        const pick = a => a[rnd(0, a.length - 1)];
        const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
        window.mask = s => { s = String(s || ''); return s ? s.charAt(0) + '*'.repeat(Math.max(3, Math.min(s.length - 1, 6))) : '-'; };

        const DS = {
            first: ['Budi','Siti','Andi','Dewi','Rizky','Putri','Agus','Ratna','Dedi','Fitri','Joko','Lestari','Hendra','Maya','Bayu','Nur','Fajar','Wulan','Eko','Intan'],
            last: ['Santoso','Wijaya','Pratama','Lestari','Saputra','Hidayat','Kusuma','Rahayu','Setiawan','Nugroho','Wibowo','Permata'],
            street: ['Jl. Melati','Jl. Kenanga','Jl. Merdeka','Jl. Sudirman','Jl. Ahmad Yani','Jl. Diponegoro','Jl. Cendana','Jl. Mawar'],
            city: ['Surabaya','Malang','Jakarta','Bandung','Semarang','Medan','Makassar','Yogyakarta','Bekasi','Depok'],
            prod: ['Serum Wajah Glow','Sepatu Sneakers Pria','Tas Selempang Wanita','Headset Bluetooth','Jam Tangan Digital','Blender Portable','Lampu LED Meja','Kemeja Flanel','Power Bank 20000mAh','Case HP Premium','Sandal Slide Unisex','Skincare Set Paket']
        };

        // Harga = base + jitter. Komisi 5%-25%: makin mahal makin besar persentasenya.
        function priceItem(it, base) {
            const harga = Math.round((base + it.j) / 1000) * 1000;
            let pct = 5 + Math.min(1, harga / 1500000) * 17 + it.n;
            pct = Math.round(Math.max(5, Math.min(25, pct)) * 10) / 10;
            return { ...it, harga, pct, komisi: Math.round(harga * pct / 100 / 100) * 100 };
        }
        function newItem(base) {
            return priceItem({
                id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                nama: pick(DS.first) + ' ' + pick(DS.last),
                nohp: '08' + rnd(10, 99) + String(rnd(0, 99999999)).padStart(8, '0'),
                alamat: pick(DS.street) + ' No. ' + rnd(1, 150) + ', ' + pick(DS.city),
                produk: pick(DS.prod),
                j: rnd(0, 20) * 1000,
                n: Math.random() * 3
            }, base);
        }
        function ensureDs() {
            const u = window.currentUser;
            if (u.dsDay === todayKey() && Array.isArray(u.dsItems)) return;
            const base = rnd(5, 9) * 10000; // harga awal harian 50-90k
            const items = Array.from({ length: 10 }, () => newItem(base));
            Object.assign(u, { dsDay: todayKey(), dsBase: base, dsDropped: 0, dsItems: items });
            updateDoc(memRef(u.id), { dsDay: u.dsDay, dsBase: base, dsDropped: 0, dsItems: items }).catch(console.error);
        }

        window.renderDrhopsipTab = function() {

                    </div>
                </div>`;
        }

        window.refreshDs = async function() {
            ensureDs();
            const u = window.currentUser;
            const n = 10 - (u.dsDropped || 0);
            if (n <= 0) { window.showToast("Info", "Kuota hari ini sudah habis.", true); return; }
            u.dsItems = Array.from({ length: n }, () => newItem(u.dsBase));
            try {
                await updateDoc(memRef(u.id), { dsItems: u.dsItems });
                window.showToast("Refresh", "Data Drhopsip baru dimuat.");

        window.dropItem = function(id) {
            const it = (window.currentUser.dsItems || []).find(x => x.id === id);
            if (!it) return;
            if (Number(window.currentUser.saldo) < it.harga) {
                window.showToast("Saldo Tidak Cukup", "Silakan lakukan Deposit terlebih dahulu.", true);
                return;
            }
            window.showConfirm("Konfirmasi DROP", `Drop produk seharga ${window.formatRupiah(it.harga)}? Saldo dipotong dan akan kembali beserta komisi ${window.formatRupiah(it.komisi)} setelah status COMPLETE oleh admin.`, async () => {
                const u = window.currentUser;
                try {
                    const newBase = u.dsBase + rnd(5, 10) * 10000; // naik 50-100k
                    const rest = u.dsItems.filter(x => x.id !== id).map(x => priceItem(x, newBase));
                    const newSaldo = Number(u.saldo) - it.harga;
                    await updateDoc(memRef(u.id), { saldo: newSaldo, dsBase: newBase, dsDropped: (u.dsDropped || 0) + 1, dsItems: rest });
                    Object.assign(u, { saldo: newSaldo, dsBase: newBase, dsDropped: (u.dsDropped || 0) + 1, dsItems: rest });
                    await addDoc(colRef('transactions'), {
                        userId: u.id, username: u.username, type: 'Drhopsip',
                        productName: it.produk, nama: it.nama, nohp: it.nohp, alamat: it.alamat,
                        amount: it.harga, komisi: it.komisi, status: 'Pending', date: new Date().toISOString()

                    window.showToast("Gagal", "Terjadi kesalahan saat DROP.", true);
                }
            });
        }

        window.openCam = async function() {
            try {
                stopCam();
                camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                const v = document.getElementById('cam-video');
                v.srcObject = camStream;
                v.classList.remove('hidden');
                ['cam-preview', 'btn-open', 'btn-shot'].forEach(i => document.getElementById(i).classList.add('hidden'));
                document.getElementById('btn-snap').classList.remove('hidden');

        }

        window.snapPhoto = function() {
            const v = document.getElementById('cam-video');
            if (!v.videoWidth) return;
            const c = document.createElement('canvas');
            c.width = 320; c.height = Math.round(320 * v.videoHeight / v.videoWidth);
            c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
            const data = c.toDataURL('image/jpeg', 0.6);
            if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
            shotData = data;
            v.classList.add('hidden');
            const p = document.getElementById('cam-preview');
            p.src = data; p.classList.remove('hidden');
            document.getElementById('btn-snap').classList.add('hidden');
            document.getElementById('btn-shot').classList.remove('hidden');
        }

                const u = window.currentUser;

                    await addDoc(colRef('attendance'), {
                        userId: u.id, username: u.username, nama: u.nama,
                        dateKey: todayKey(), date: new Date().toISOString(),

        // ================= ACTIONS & MODALS =================
        window.buyProduct = function(productId) {
            const product = window.catalogData.find(p => p.id === productId);
            if (!product) return;

            if (window.currentUser.saldo < Number(product.harga)) {
                window.showToast("Saldo Tidak Cukup", "Saldo Anda tidak mencukupi untuk checkout produk ini. Silakan lakukan Deposit.", true);
                return;
            }

            window.showConfirm("Konfirmasi Checkout", `Beli produk "${product.nama}" seharga ${window.formatRupiah(product.harga)}? Saldo akan dipotong dan komisi akan masuk setelah Complete oleh admin.`, async () => {
                try {
                    // Deduct balance immediately
                    const newSaldo = Number(window.currentUser.saldo) - Number(product.harga);
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members', window.currentUser.id), {
                        saldo: newSaldo
                    });
                    window.currentUser.saldo = newSaldo;

                    // Add transaction
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'transactions'), {
                        userId: window.currentUser.id,
                        username: window.currentUser.username,
                        type: 'Pembelian Produk',
                        productId: product.id,
                        productName: product.nama,
                        amount: Number(product.harga),
                        komisi: Number(product.komisi),
                        status: 'Pending',
                        date: new Date().toISOString()
                    });

                    window.showToast("Berhasil", "Checkout berhasil! Status transaksi Pending.");
                    switchTab('history');
                } catch (err) {
                    console.error("Buy error:", err);
                    window.showToast("Gagal", "Terjadi kesalahan saat transaksi.", true);
                }
            });
        }

        window.openDepositModal = function() {
            const nominal = prompt("Masukkan nominal Deposit (Rp):", "50000");
            if (!nominal || isNaN(nominal) || Number(nominal) <= 0) return;
            currentDepositNominal = Number(nominal);

            document.getElementById('qris-image-display').src = window.adminSettings.qrisUrl || 'https://placehold.co/250x250/121212/FFFFFF?text=QRIS+Admin';
            document.getElementById('qris-amount-display').innerText = `Nominal: ${window.formatRupiah(currentDepositNominal)}`;
            document.getElementById('qris-modal').classList.remove('hidden');
        }

        window.closeQrisModal = function() {
            document.getElementById('qris-modal').classList.add('hidden');
        }

        window.confirmDepositSubmit = async function() {
            closeQrisModal();
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'transactions'), {
                    userId: window.currentUser.id,
                    username: window.currentUser.username,
                    type: 'Deposit',
                    productName: 'Deposit Saldo via QRIS',
                    amount: currentDepositNominal,
                    komisi: 0,
                    status: 'Pending',
                    date: new Date().toISOString()
                });
                window.showToast("Berhasil", "Permintaan deposit terkirim. Menunggu konfirmasi admin.");
                switchTab('history');
            } catch (err) {
                console.error("Deposit error:", err);
                window.showToast("Gagal", "Gagal mengirim deposit.", true);
            }
        }

        window.openWithdrawModal = function() {
            const nominal = prompt("Masukkan nominal Withdraw / Penarikan (Rp):", "50000");
            if (!nominal || isNaN(nominal) || Number(nominal) <= 0) return;
            const amount = Number(nominal);

            if (window.currentUser.saldo < amount) {
                window.showToast("Saldo Kurang", "Saldo Anda tidak mencukupi untuk penarikan ini.", true);
                return;
            }

            window.showConfirm("Konfirmasi Withdraw", `Tarik dana sebesar ${window.formatRupiah(amount)} ke rekening ${window.currentUser.bank} (${window.currentUser.norek})?`, async () => {
                try {
                    const newSaldo = Number(window.currentUser.saldo) - amount;
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members', window.currentUser.id), {
                        saldo: newSaldo
                    });
                    window.currentUser.saldo = newSaldo;

                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'transactions'), {
                        userId: window.currentUser.id,
                        username: window.currentUser.username,
                        type: 'Withdraw',
                        productName: `Withdraw ke ${window.currentUser.bank} - ${window.currentUser.norek}`,
                        amount: amount,
                        komisi: 0,
                        status: 'Pending',
                        date: new Date().toISOString()
                    });

                    window.showToast("Berhasil", "Permintaan withdraw terkirim. Menunggu proses admin.");
                    switchTab('history');
                } catch (err) {
                    console.error("Withdraw error:", err);
                    window.showToast("Gagal", "Gagal melakukan withdraw.", true);
                }
            });
        }

        window.saveAdminQris = async function() {
            const url = document.getElementById('admin-qris-url').value.trim();
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'admin_config'), {
                    qrisUrl: url
                });
                window.showToast("Berhasil", "QRIS berhasil diperbarui.");
            } catch (err) {
                console.error("Save QRIS error:", err);
                window.showToast("Gagal", "Gagal menyimpan QRIS.", true);
            }
        }

        window.addCatalogProduct = async function(e) {
            e.preventDefault();
            const nama = document.getElementById('cat-nama').value.trim();
            const harga = Number(document.getElementById('cat-harga').value);
            const komisi = Number(document.getElementById('cat-komisi').value);
            const fotoUrl = document.getElementById('cat-foto').value.trim();

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'catalog'), {
                    nama, harga, komisi, fotoUrl
                });
                window.showToast("Berhasil", "Produk ditambahkan ke katalog.");
                document.getElementById('cat-nama').value = '';
                document.getElementById('cat-harga').value = '';
                document.getElementById('cat-komisi').value = '';
                document.getElementById('cat-foto').value = '';
            } catch (err) {
                console.error("Add catalog error:", err);
                window.showToast("Gagal", "Gagal menambah produk.", true);
            }
        }

        window.deleteCatalog = async function(id) {
            window.showConfirm("Hapus Produk", "Yakin ingin menghapus produk ini dari katalog?", async () => {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'catalog', id));
                    window.showToast("Berhasil", "Produk dihapus.");
                } catch (err) {
                    console.error("Delete catalog error:", err);
                    window.showToast("Gagal", "Gagal menghapus produk.", true);
                }
            });
        }

        window.editMember = async function(memberId) {
            const member = window.membersData.find(m => m.id === memberId);
            if (!member) return;

            const newNama = prompt("Edit Nama:", member.nama);
            if (newNama === null) return;
            const newSaldo = prompt("Edit Saldo (Rp):", member.saldo);
            if (newSaldo === null || isNaN(newSaldo)) return;

            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members', memberId), {
                    nama: newNama,
                    saldo: Number(newSaldo)
                });
                window.showToast("Berhasil", "Data member diperbarui.");
            } catch (err) {
                console.error("Edit member error:", err);
                window.showToast("Gagal", "Gagal memperbarui member.", true);
            }
        }

        window.deleteMember = async function(memberId) {
            window.showConfirm("Hapus Member", "Yakin ingin menghapus member ini?", async () => {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members', memberId));
                    window.showToast("Berhasil", "Member dihapus.");
                } catch (err) {
                    console.error("Delete member error:", err);
                    window.showToast("Gagal", "Gagal menghapus member.", true);
                }
            });
        }

        window.completeTransaction = async function(txId) {
            const tx = window.transactionsData.find(t => t.id === txId);
            if (!tx) return;

            window.showConfirm("Ubah Status Complete", `Ubah status transaksi ${tx.type} menjadi Complete? Jika ini pembelian produk, komisi (${window.formatRupiah(tx.komisi || 0)}) dan uang checkout akan dikembalikan/masuk ke akun member.`, async () => {
                try {
                    // Update transaction status to Complete
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'transactions', txId), {
                        status: 'Complete'
                    });

                    // If it's a purchase, return capital + komisi to member balance
                    if ((tx.type === 'Pembelian Produk' || tx.type === 'Drhopsip') && tx.userId) {
                        const member = window.membersData.find(m => m.id === tx.userId);
                        if (member) {
                            const refundAndCommission = Number(tx.amount) + Number(tx.komisi || 0);
                            const updatedSaldo = Number(member.saldo) + refundAndCommission;
                            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members', tx.userId), {
                                saldo: updatedSaldo
                            });
                        }
                    } else if (tx.type === 'Deposit' && tx.userId) {
                        // If deposit is completed by admin, add deposit amount to member balance
                        const member = window.membersData.find(m => m.id === tx.userId);
                        if (member) {
                            const updatedSaldo = Number(member.saldo) + Number(tx.amount);
                            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'members', tx.userId), {
                                saldo: updatedSaldo
                            });
                        }
                    }

                    window.showToast("Berhasil", "Status transaksi diubah menjadi Complete dan saldo/komisi diperbarui.");
                } catch (err) {
                    console.error("Complete tx error:", err);
                    window.showToast("Gagal", "Gagal memproses transaksi.", true);
                }
            });
        }

        // Initialize on Load
        window.onload = async function() {
            await initAuth();
            setupListeners();
            renderApp();
        }
    </script>
